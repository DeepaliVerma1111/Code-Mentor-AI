server.port=8080
spring.application.name=codementor-backend

# Gemini AI
gemini.model=gemini-3.5-flash

# Do NOT put the real API key here.
# Set GEMINI_API_KEY as an environment variable before starting the backend.

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/codementorai
spring.datasource.username=root
spring.datasource.password=MySql@1234

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true